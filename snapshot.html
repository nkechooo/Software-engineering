<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>网页快照</title>
</head>

<body>
    <div style="background:#f5f7fa;padding:12px 18px 8px 18px;border-radius:6px;margin-bottom:16px;">
        <div style="font-size:1.1em;font-weight:bold;color:#174a8c;">
            {{ title or '无标题' }}
        </div>
        <div style="font-size:0.95em;color:#888;margin-top:2px;">
            快照保存时间：{{ snapshot_time }}
        </div>
    </div>
    <div>{{ raw_html|safe }}</div>
    <a href="/">返回搜索页</a>
</body>

</html>
